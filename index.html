<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen active">
    <header class="brand">
      <span class="brand-mark">#</span>
      <h1>Classroom Counter</h1>
      <p class="brand-sub">Count students by photo, not by hand.</p>
    </header>

    <div class="tally">
      <span class="tally-label">Total</span>
      <span id="home-total" class="tally-number">0</span>
      <div class="tally-controls">
        <button id="home-minus" class="btn-round" aria-label="Subtract one">&minus;</button>
        <button id="home-plus" class="btn-round" aria-label="Add one">&plus;</button>
      </div>
    </div>

    <button id="start-camera" class="btn-primary">Start camera</button>
    <p id="camera-status" class="status-line"></p>
  </section>

  <!-- CAMERA SCREEN -->
  <section id="screen-camera" class="screen">
    <div class="mode-toggle">
      <button id="mode-single" class="mode-btn active" type="button">Single photo</button>
      <button id="mode-panorama" class="mode-btn" type="button">Panorama</button>
    </div>

    <div class="camera-frame">
      <video id="camera-preview" playsinline autoplay muted></video>
      <canvas id="capture-canvas" class="hidden"></canvas>
    </div>
    <button id="take-photo" class="btn-primary">Take photo</button>

    <p id="pano-info" class="status-line hidden"></p>
    <button id="pano-finish" class="btn-secondary hidden">Align &amp; combine</button>

    <div class="session-line">
      <span>Photos added: <strong id="cam-photo-count">0</strong></span>
      <span>Total: <strong id="cam-total">0</strong></span>
    </div>
    <button id="cancel-camera" class="btn-text">Cancel</button>
  </section>

  <!-- PANORAMA ALIGN SCREEN -->
  <section id="screen-align" class="screen">
    <header class="brand">
      <h1>Line them up</h1>
      <p class="brand-sub">Drag the new photo so it overlaps the one below, then confirm.</p>
    </header>

    <div class="align-frame" id="align-frame">
      <img id="align-base" class="align-layer" alt="">
      <img id="align-overlay" class="align-layer" alt="">
    </div>

    <div class="review-actions">
      <button id="align-reset" class="btn-secondary">Reset position</button>
      <button id="align-confirm" class="btn-primary">Confirm</button>
    </div>
  </section>

  <!-- REVIEW SCREEN -->
  <section id="screen-review" class="screen">
    <div class="camera-frame">
      <canvas id="review-canvas"></canvas>
    </div>

    <div class="review-count">
      <span class="review-label">AI detected</span>
      <div class="tally-controls">
        <button id="review-minus" class="btn-round" aria-label="Subtract one">&minus;</button>
        <span id="review-number" class="tally-number">0</span>
        <button id="review-plus" class="btn-round" aria-label="Add one">&plus;</button>
      </div>
    </div>

    <div class="review-actions">
      <button id="retake-photo" class="btn-secondary">Retake</button>
      <button id="add-to-total" class="btn-primary">Add to total</button>
    </div>
  </section>

  <!-- FINAL SCREEN -->
  <section id="screen-final" class="screen">
    <header class="brand">
      <h1>Classroom count</h1>
    </header>

    <div class="tally">
      <span id="final-total" class="tally-number">0</span>
    </div>

    <ul id="final-breakdown" class="breakdown"></ul>

    <button id="new-count" class="btn-primary">New count</button>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
